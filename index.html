<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y2K Vintage Annual Sale</title>
<meta name="description" content="Y2K Vintage annual sale.">
<meta property="og:title" content="Y2K Vintage Annual Sale">
<style>
/* Layout mimics the Canva "BF WEBSITE" mock: black Arial headline spanning the width, then photos */
:root{--aqua:#66ddfb;--ink:#111111;--ph:#9fe6fb;--frame:#d4f6ff;--white:#ffffff}
*{box-sizing:border-box}
html{background:var(--aqua)}
body{margin:0;background:var(--aqua);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:22px 6px;text-align:center}
.headline{margin:0;font-weight:700;letter-spacing:-.065em;line-height:.98;text-align:left;color:var(--ink);white-space:nowrap;font-size:20px}
.headline span{display:block}
.headline span:first-child{display:flex;justify-content:space-between;letter-spacing:-.065em}
.sub{margin:18px 0 0;font-weight:700;letter-spacing:-.05em;font-size:clamp(14px,3.9vw,22px)}
.sub sup{font-size:.55em}
.peek{margin:12px 0 0;font-weight:700;letter-spacing:-.06em;font-size:clamp(22px,6.4vw,36px)}
nav{position:sticky;top:0;z-index:2;background:var(--aqua)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip:first-child{margin-left:auto}.chip:last-child{margin-right:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:700;font-size:14px;letter-spacing:-.03em;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--aqua)}
.chip:focus-visible{outline:2px solid var(--white);outline-offset:2px}
section{padding-block:14px 4px}
h2{font-weight:700;font-size:20px;letter-spacing:-.05em;margin:0 0 10px;color:var(--ink);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
/* Each photo sits in a lighter-blue frame (mat) */
.ph{aspect-ratio:3/4;background:var(--frame);padding:10px;border-radius:6px;overflow:hidden}
.ph:empty::before{content:"";display:block;width:100%;height:100%;background:var(--ph)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
/* Price slideshow (only when switched on in /admin) */
.show{position:relative;margin-bottom:22px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:16px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;max-width:100%}
.slide .ph{max-width:min(460px,calc(56vh * 3 / 4));margin:0 auto}
.price{display:flex;justify-content:center;align-items:baseline;gap:14px;margin-top:10px;font-weight:700;letter-spacing:-.05em}
.price s{font-size:clamp(20px,6vw,28px);text-decoration-thickness:3px;opacity:.75}
.price b{font-size:clamp(34px,11vw,52px)}
.nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:8px;font-weight:700}
.nav button{font:inherit;font-weight:700;font-size:20px;width:44px;height:44px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
footer{padding-block:28px 40px;font-size:13px;font-weight:700;text-align:center;letter-spacing:-.02em}
.topbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:10px;max-width:calc(100vw - 24px)}
.topbar .banner{box-shadow:0 6px 20px rgba(0,0,0,.18)}
.banner.lower{text-transform:none}
.banner{display:block;text-decoration:none;background:var(--white);color:var(--ink);text-align:center;font-weight:700;font-size:clamp(14px,4.4vw,17px);letter-spacing:-.05em;text-transform:uppercase;padding:10px clamp(12px,4vw,18px);border-radius:14px;white-space:nowrap}
</style>
</head><body>
<header class="wrap">
  <h1 class="headline" id="headline">
    <span><b>WE’VE</b> <b>SAVED</b> <b>8000+</b> <b>VINTAGE</b> <b>PIECES</b></span>
    <span>AND WE’RE SELLING THEM FOR £5 - £30.</span>
    <span>Y2K VINTAGE ANNUAL SALE.</span>
    <span>SHOP IN STORE.</span>
    <span>ONE. WEEKEND. ONLY.</span>
  </h1>
  <p class="sub">27<sup>th</sup> - 29<sup>th</sup> NOVEMBER &nbsp;★&nbsp; Y2K VINTAGE STORES</p>
  <p class="peek">SNEAK PEEK BELOW</p>
</header>
<main class="wrap" id="cats" style="padding-top:14px"></main>
<footer class="wrap">@Y2KXVINTAGE</footer>
<div class="topbar"><a class="banner" id="early" href="https://linktr.ee/y2kxvintage?utm_source=annual_sale_page&amp;utm_medium=qr&amp;utm_campaign=early_access">Want early access?</a><a class="banner lower" href="https://www.instagram.com/y2kxvintage/" target="_blank" rel="noopener">SOCIALS</a></div>
<script>
// Two versions of this page: London (default, with early access) and Brighton & Leeds (/brighton-leeds, no early access).
// Brighton & Leeds QR tags start with "bl-".
var SALE_BL=/^\/brighton-leeds/.test(location.pathname)||/^\/qr\/bl-/i.test(location.pathname)||/[?&]qr=bl-/i.test(location.search);
if(SALE_BL){var e=document.getElementById('early');if(e)e.remove()}
</script>
<script>
let DATA={items:[]};
let PRICES=null; // filled from Supabase when the price slideshow is switched on in /admin
function photoSrc(p){return p.startsWith('http')||p.startsWith('/')?p:'/'+p}
function money(v){v=+v;return '£'+(v%1?v.toFixed(2):v)}
function render(){
  const main=document.getElementById('cats');main.innerHTML='';
  const items=DATA.items.filter(i=>i.active!==false&&i.photo);
  const key=p=>p.replace(/^\//,'');
  const priced=PRICES?items.filter(i=>PRICES[key(i.photo)]):[];
  if(priced.length)main.appendChild(slideshow(priced.map(i=>({photo:i.photo,...PRICES[key(i.photo)]}))));
  // Everything without a price (or everything, when the slideshow is off) stays in the photo grid.
  const rest=items.filter(i=>!priced.includes(i));
  if(!rest.length)return;
  const g=document.createElement('div');g.className='grid';
  rest.forEach(i=>{
    const d=document.createElement('div');d.className='ph';
    const im=document.createElement('img');im.src=photoSrc(i.photo);im.alt='Sale piece';im.loading='lazy';d.appendChild(im);
    g.appendChild(d);
  });
  main.appendChild(g);
}
function slideshow(list){
  const wrap=document.createElement('div');wrap.className='show';
  const track=document.createElement('div');track.className='track';
  list.forEach((it,n)=>{
    const sl=document.createElement('div');sl.className='slide';
    const f=document.createElement('div');f.className='ph';
    const im=document.createElement('img');im.src=photoSrc(it.photo);im.alt='Sale piece';if(n>1)im.loading='lazy';f.appendChild(im);
    const pr=document.createElement('div');pr.className='price';
    if(it.old_price!=null&&+it.old_price>+it.new_price){const o=document.createElement('s');o.textContent=money(it.old_price);pr.appendChild(o)}
    const nw=document.createElement('b');nw.textContent=money(it.new_price);pr.appendChild(nw);
    sl.append(f,pr);track.appendChild(sl);
  });
  const nav=document.createElement('div');nav.className='nav';
  const prev=document.createElement('button');prev.textContent='‹';prev.setAttribute('aria-label','Previous');
  const next=document.createElement('button');next.textContent='›';next.setAttribute('aria-label','Next');
  const count=document.createElement('span');
  nav.append(prev,count,next);wrap.append(track,nav);
  const cur=()=>Math.round(track.scrollLeft/(track.clientWidth+16));
  const go=i=>{i=(i+list.length)%list.length;track.scrollTo({left:i*(track.clientWidth+16),behavior:'smooth'})};
  const upd=()=>{count.textContent=(cur()+1)+' / '+list.length};
  track.addEventListener('scroll',()=>requestAnimationFrame(upd));upd();
  let paused=false,t=null;const stop=()=>{paused=true};
  prev.onclick=()=>{stop();go(cur()-1)};next.onclick=()=>{stop();go(cur()+1)};
  track.addEventListener('touchstart',stop,{passive:true});track.addEventListener('pointerdown',stop);
  if(list.length>1)t=setInterval(()=>{if(!paused&&!document.hidden)go(cur()+1)},3500);
  return wrap;
}
function fitHeadline(){
  const h=document.getElementById('headline');if(!h)return;
  const w=h.clientWidth;h.style.fontSize='100px';
  const lines=[...h.children].slice(1);
  const widest=Math.max(...lines.map(l=>{const r=document.createRange();r.selectNodeContents(l);return r.getBoundingClientRect().width}));
  h.style.fontSize=Math.floor(100*w/widest*10)/10+'px';
}
fitHeadline();addEventListener('resize',fitHeadline);
fetch('/items.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;render()})
  .catch(()=>{document.getElementById('cats').textContent='Could not load the sale. Please refresh.'});
// Prices: only shown once the slideshow is switched on in /admin.
(function(){
  var SB='https://xotyvlaeuyujoqrtdxiy.supabase.co',H={apikey:'sb_publishable_w6UzqtXtgJshqYwdCUpaug_NjX0KBwu','Content-Type':'application/json'};
  fetch(SB+'/rest/v1/rpc/sale_admin_status',{method:'POST',headers:H,body:'{}'}).then(r=>r.json()).then(s=>{
    if(!s||!s.slideshow_live)return;
    return fetch(SB+'/rest/v1/sale_item_prices?select=photo,old_price,new_price&new_price=not.is.null',{headers:H}).then(r=>r.json()).then(rows=>{
      PRICES={};rows.forEach(r=>PRICES[r.photo]=r);if(DATA.items.length)render();
    });
  }).catch(()=>{});
})();
</script>
<script>
// Visit counter: QR codes open /qr/<tag> (e.g. /qr/poster). One row per page open in Supabase sale_visits.
(function(){
  try{
    var m=location.pathname.match(/^\/qr\/([a-z0-9-]{1,40})/i)||location.search.match(/[?&]qr=([a-z0-9-]{1,40})/i);
    var source=m?('qr-'+m[1].toLowerCase()):'direct';
    var vid=null;
    try{vid=localStorage.getItem('sale_vid');if(!vid){vid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));localStorage.setItem('sale_vid',vid)}}catch(e){}
    var device=/iPhone|iPad/.test(navigator.userAgent)?'ios':/Android/.test(navigator.userAgent)?'android':'other';
    var row={source:source,visitor_id:vid,device:device,referrer:(document.referrer||'').slice(0,300)};
    var log=function(){fetch('https://xotyvlaeuyujoqrtdxiy.supabase.co/rest/v1/sale_visits',{method:'POST',keepalive:true,
      headers:{'apikey':'sb_publishable_w6UzqtXtgJshqYwdCUpaug_NjX0KBwu','Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(row)}).catch(function(){})};
    // Approximate city from the visitor's connection (Vercel geo). If it fails or is slow, log without it.
    var done=false,once=function(){if(!done){done=true;log()}};
    setTimeout(once,2500);
    fetch('/api/geo',{cache:'no-store'}).then(function(r){return r.json()}).then(function(g){
      if(g){row.city=g.city?String(g.city).slice(0,80):null;row.region=g.region?String(g.region).slice(0,20):null;row.country=g.country?String(g.country).slice(0,5):null}
      once()}).catch(once);
    if(m||SALE_BL)history.replaceState(null,'',SALE_BL?'/brighton-leeds':'/');
  }catch(e){}
})();
</script>
</body></html>
