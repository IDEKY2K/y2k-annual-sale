<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y2K Vintage Annual Sale</title>
<meta name="description" content="Y2K Vintage annual sale.">
<meta property="og:title" content="Y2K Vintage Annual Sale">
<style>
:root{--bg:#ffffff;--fg:#141414;--muted:#6b6b6b;--ph:#ececec;--line:#e2e2e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 12px}
h1{font-size:28px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em}
header p{margin:0;color:var(--muted)}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;border:1px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
section{padding-block:20px 4px}
h2{font-size:18px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.ph{aspect-ratio:4/5;background:var(--ph);border-radius:4px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
footer{padding-block:28px 40px;color:var(--muted);font-size:13px}
</style>
</head><body>
<header class="wrap">
  <h1>Annual Sale</h1>
  <p>Y2K Vintage</p>
</header>
<nav aria-label="Categories"><div class="wrap chips" id="chips"></div></nav>
<main class="wrap" id="cats"></main>
<footer class="wrap">Y2K Vintage</footer>
<script>
let DATA={categories:[],items:[]};let active='all';
function render(){
  const cats=DATA.categories;
  const chips=document.getElementById('chips');chips.innerHTML='';
  ['all'].concat(cats).forEach(c=>{
    const b=document.createElement('button');b.className='chip';b.textContent=c==='all'?'All':c;
    b.setAttribute('aria-pressed',String(active===c));
    b.onclick=()=>{active=c;render()};chips.appendChild(b);
  });
  const main=document.getElementById('cats');main.innerHTML='';
  cats.filter(c=>active==='all'||active===c).forEach(c=>{
    const items=DATA.items.filter(i=>i.category===c&&i.active!==false);
    if(!items.length)return;
    const s=document.createElement('section');
    s.innerHTML='<h2></h2><div class="grid"></div>';
    s.querySelector('h2').textContent=c;
    const g=s.querySelector('.grid');
    items.forEach(i=>{
      const d=document.createElement('div');d.className='ph';
      if(i.photo){const im=document.createElement('img');im.src=i.photo;im.alt=c;im.loading='lazy';d.appendChild(im)}
      g.appendChild(d);
    });
    main.appendChild(s);
  });
}
fetch('items.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;render()})
  .catch(()=>{document.getElementById('cats').textContent='Could not load the sale. Please refresh.'});
</script>
</body></html>
