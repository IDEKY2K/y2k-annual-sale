<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y2K Vintage Annual Sale</title>
<meta name="description" content="Y2K Vintage annual sale.">
<meta property="og:title" content="Y2K Vintage Annual Sale">
<style>
/* Layout mimics the Canva "BF WEBSITE" mock: black Arial headline spanning the width, then photos */
:root{--aqua:#66ddfb;--ink:#111111;--ph:#b8eefd;--white:#ffffff}
*{box-sizing:border-box}
html{background:var(--aqua)}
body{margin:0;background:var(--aqua);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:22px 6px;text-align:center}
.headline{margin:0;font-weight:700;letter-spacing:-.065em;line-height:.98;text-align:left;color:var(--ink);white-space:nowrap;font-size:20px}
.headline span{display:block}
.headline span:first-child{display:flex;justify-content:space-between;letter-spacing:-.065em}
.sub{margin:18px 0 0;font-weight:700;letter-spacing:-.05em;font-size:clamp(14px,3.9vw,22px)}
.sub sup{font-size:.55em}
.peek{margin:12px 0 0;font-weight:700;letter-spacing:-.06em;font-size:clamp(22px,6.4vw,36px)}
nav{position:sticky;top:0;z-index:2;background:var(--aqua)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip:first-child{margin-left:auto}.chip:last-child{margin-right:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:700;font-size:14px;letter-spacing:-.03em;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--aqua)}
.chip:focus-visible{outline:2px solid var(--white);outline-offset:2px}
section{padding-block:14px 4px}
h2{font-weight:700;font-size:20px;letter-spacing:-.05em;margin:0 0 10px;color:var(--ink);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.ph{aspect-ratio:4/5;background:var(--white);overflow:hidden}
.ph:empty{background:var(--ph)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
footer{padding-block:28px 40px;font-size:13px;font-weight:700;text-align:center;letter-spacing:-.02em}
.topbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.banner{display:block;text-decoration:none;background:var(--white);color:var(--ink);text-align:center;font-weight:700;font-size:17px;letter-spacing:-.05em;text-transform:uppercase;padding:10px 18px;border-radius:14px;white-space:nowrap}
</style>
</head><body>
<header class="wrap">
  <h1 class="headline" id="headline">
    <span><b>WE’VE</b> <b>SAVED</b> <b>8000+</b> <b>VINTAGE</b> <b>PIECES</b></span>
    <span>AND WE’RE SELLING THEM FOR £5 - £30.</span>
    <span>Y2K VINTAGE ANNUAL SALE.</span>
    <span>SHOP IN STORE.</span>
    <span>ONE. WEEKEND. ONLY.</span>
  </h1>
  <p class="sub">27<sup>th</sup> - 29<sup>th</sup> NOVEMBER &nbsp;★&nbsp; Y2K VINTAGE STORES</p>
  <p class="peek">SNEAK PEAK BELOW</p>
</header>
<nav aria-label="Categories"><div class="wrap chips" id="chips"></div></nav>
<main class="wrap" id="cats"></main>
<footer class="wrap">@Y2KXVINTAGE</footer>
<a class="banner topbar" href="https://linktr.ee/y2kxvintage?utm_source=annual_sale_page&amp;utm_medium=qr&amp;utm_campaign=early_access">Want early access?</a>
<script>
let DATA={categories:[],items:[]};let active='all';
function render(){
  const cats=DATA.categories;
  const chips=document.getElementById('chips');chips.innerHTML='';
  ['all'].concat(cats).forEach(c=>{
    const b=document.createElement('button');b.className='chip';b.textContent=c==='all'?'All':c;
    b.setAttribute('aria-pressed',String(active===c));
    b.onclick=()=>{active=c;render()};chips.appendChild(b);
  });
  const main=document.getElementById('cats');main.innerHTML='';
  cats.filter(c=>active==='all'||active===c).forEach(c=>{
    const items=DATA.items.filter(i=>i.category===c&&i.active!==false);
    if(!items.length)return;
    const s=document.createElement('section');
    s.innerHTML='<h2></h2><div class="grid"></div>';
    s.querySelector('h2').textContent=c;
    const g=s.querySelector('.grid');
    items.forEach(i=>{
      const d=document.createElement('div');d.className='ph';
      if(i.photo){const im=document.createElement('img');im.src=i.photo.startsWith('http')||i.photo.startsWith('/')?i.photo:'/'+i.photo;im.alt=c;im.loading='lazy';d.appendChild(im)}
      g.appendChild(d);
    });
    main.appendChild(s);
  });
}
function fitHeadline(){
  const h=document.getElementById('headline');if(!h)return;
  const w=h.clientWidth;h.style.fontSize='100px';
  const lines=[...h.children].slice(1);
  const widest=Math.max(...lines.map(l=>{const r=document.createRange();r.selectNodeContents(l);return r.getBoundingClientRect().width}));
  h.style.fontSize=Math.floor(100*w/widest*10)/10+'px';
}
fitHeadline();addEventListener('resize',fitHeadline);
fetch('/items.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;render()})
  .catch(()=>{document.getElementById('cats').textContent='Could not load the sale. Please refresh.'});
</script>
<script>
// Visit counter: QR codes open /qr/<tag> (e.g. /qr/poster). One row per page open in Supabase sale_visits.
(function(){
  try{
    var m=location.pathname.match(/^\/qr\/([a-z0-9-]{1,40})/i)||location.search.match(/[?&]qr=([a-z0-9-]{1,40})/i);
    var source=m?('qr-'+m[1].toLowerCase()):'direct';
    var vid=null;
    try{vid=localStorage.getItem('sale_vid');if(!vid){vid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));localStorage.setItem('sale_vid',vid)}}catch(e){}
    var device=/iPhone|iPad/.test(navigator.userAgent)?'ios':/Android/.test(navigator.userAgent)?'android':'other';
    fetch('https://xotyvlaeuyujoqrtdxiy.supabase.co/rest/v1/sale_visits',{method:'POST',keepalive:true,
      headers:{'apikey':'sb_publishable_w6UzqtXtgJshqYwdCUpaug_NjX0KBwu','Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({source:source,visitor_id:vid,device:device,referrer:(document.referrer||'').slice(0,300)})}).catch(function(){});
    if(m)history.replaceState(null,'','/');
  }catch(e){}
})();
</script>
</body></html>
