<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y2K Vintage Annual Sale</title>
<meta name="description" content="Y2K Vintage annual sale.">
<meta property="og:title" content="Y2K Vintage Annual Sale">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Special+Elite&display=swap">
<style>
/* Colours from the BF26 annual sale posters */
:root{--aqua:#7fdce8;--cream:#fdfcf5;--ink:#1c1c1c;--cyan:#16b4ee;--ph:#bfeef4}
*{box-sizing:border-box}
html{background:var(--aqua)}
body{margin:0;background:var(--aqua);color:var(--ink);font-family:'Comfortaa',system-ui,sans-serif;font-size:15px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:36px 18px;color:var(--cream)}
.logo{margin:0;line-height:0}
.logo img{width:100%;max-width:480px;height:auto}
.stamp{display:inline-block;margin-top:20px;font-family:'Special Elite','Courier New',monospace;color:var(--ink);border:2px dashed var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-3deg)}
nav{position:sticky;top:0;background:var(--aqua);z-index:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:700;font-size:14px;border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:999px;padding:7px 15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
section{padding-block:22px 4px}
h2{font-weight:700;font-size:22px;margin:0 0 12px;color:var(--cream);text-transform:lowercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.ph{aspect-ratio:4/5;background:var(--cream);border-radius:14px;overflow:hidden}
.ph:empty{background:var(--ph);border:2px dotted var(--cream)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
footer{padding-block:32px 44px;color:var(--ink);font-family:'Special Elite','Courier New',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head><body>
<header class="wrap">
  <h1 class="logo"><img src="/assets/logo-annual-sale.png" alt="Y2K Vintage annual sale" width="1200" height="515"></h1>
  <div class="stamp">Fri 27 – Sun 29 November</div>
</header>
<nav aria-label="Categories"><div class="wrap chips" id="chips"></div></nav>
<main class="wrap" id="cats"></main>
<footer class="wrap">@y2kxvintage</footer>
<script>
let DATA={categories:[],items:[]};let active='all';
function render(){
  const cats=DATA.categories;
  const chips=document.getElementById('chips');chips.innerHTML='';
  ['all'].concat(cats).forEach(c=>{
    const b=document.createElement('button');b.className='chip';b.textContent=c==='all'?'All':c;
    b.setAttribute('aria-pressed',String(active===c));
    b.onclick=()=>{active=c;render()};chips.appendChild(b);
  });
  const main=document.getElementById('cats');main.innerHTML='';
  cats.filter(c=>active==='all'||active===c).forEach(c=>{
    const items=DATA.items.filter(i=>i.category===c&&i.active!==false);
    if(!items.length)return;
    const s=document.createElement('section');
    s.innerHTML='<h2></h2><div class="grid"></div>';
    s.querySelector('h2').textContent=c;
    const g=s.querySelector('.grid');
    items.forEach(i=>{
      const d=document.createElement('div');d.className='ph';
      if(i.photo){const im=document.createElement('img');im.src=i.photo.startsWith('http')||i.photo.startsWith('/')?i.photo:'/'+i.photo;im.alt=c;im.loading='lazy';d.appendChild(im)}
      g.appendChild(d);
    });
    main.appendChild(s);
  });
}
fetch('/items.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;render()})
  .catch(()=>{document.getElementById('cats').textContent='Could not load the sale. Please refresh.'});
</script>
<script>
// Visit counter: QR codes open /qr/<tag> (e.g. /qr/poster). One row per page open in Supabase sale_visits.
(function(){
  try{
    var m=location.pathname.match(/^\/qr\/([a-z0-9-]{1,40})/i);
    var source=m?('qr-'+m[1].toLowerCase()):'direct';
    var vid=null;
    try{vid=localStorage.getItem('sale_vid');if(!vid){vid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));localStorage.setItem('sale_vid',vid)}}catch(e){}
    var device=/iPhone|iPad/.test(navigator.userAgent)?'ios':/Android/.test(navigator.userAgent)?'android':'other';
    fetch('https://xotyvlaeuyujoqrtdxiy.supabase.co/rest/v1/sale_visits',{method:'POST',keepalive:true,
      headers:{'apikey':'sb_publishable_w6UzqtXtgJshqYwdCUpaug_NjX0KBwu','Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({source:source,visitor_id:vid,device:device,referrer:(document.referrer||'').slice(0,300)})}).catch(function(){});
    if(m)history.replaceState(null,'','/');
  }catch(e){}
})();
</script>
</body></html>
