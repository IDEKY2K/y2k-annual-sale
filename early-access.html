<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Early Access · Y2K Vintage Annual Sale</title>
<meta name="description" content="Sign up for the Y2K Vintage Annual Sale Early Access Sip 'n' Shop.">
<style>
/* Same look as the sale page: aqua background, black Arial bold, white bubbles. */
:root{--aqua:#00e0ff;--ink:#111111;--frame:#d4f6ff;--white:#ffffff}
*{box-sizing:border-box}
html{background:var(--aqua)}
body{margin:0;background:var(--aqua);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:26px max(16px,env(safe-area-inset-left,0px)) 40px}
.back{display:inline-block;color:var(--ink);font-weight:700;letter-spacing:-.03em;text-decoration:none;font-size:14px;margin-bottom:18px}
h1{margin:0;font-weight:700;letter-spacing:-.065em;line-height:.98;font-size:clamp(34px,10vw,52px)}
.sub{margin:12px 0 22px;font-weight:700;letter-spacing:-.05em;font-size:clamp(15px,4.2vw,19px);line-height:1.15}
.sub sup{font-size:.55em}
form{background:var(--frame);border-radius:14px;padding:18px 16px 20px}
label{display:block;font-weight:700;letter-spacing:-.03em;font-size:14px;text-transform:uppercase;margin:0 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{margin-bottom:14px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:11px 12px;outline:none}
input:focus-visible{box-shadow:0 0 0 3px var(--white)}
.stores{display:flex;gap:8px;flex-wrap:wrap}
.stores input{position:absolute;opacity:0;pointer-events:none}
.stores span{display:inline-block;font-weight:700;font-size:14px;letter-spacing:-.03em;border:2px solid var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;text-transform:uppercase;background:transparent}
.stores input:checked+span{background:var(--ink);color:var(--aqua)}
.stores input:focus-visible+span{outline:2px solid var(--white);outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:13px;letter-spacing:-.02em;text-transform:none;line-height:1.35;margin:4px 0 16px}
.consent input{width:20px;height:20px;flex:none;margin:0;accent-color:#111}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
button{width:100%;font:inherit;font-weight:700;font-size:18px;letter-spacing:-.05em;text-transform:uppercase;background:var(--ink);color:var(--white);border:0;border-radius:14px;padding:14px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#b00012;font-weight:700;font-size:14px;margin:0 0 12px;min-height:1px}
.done{display:none;background:var(--white);border-radius:14px;padding:22px 18px;text-align:center}
.done h2{margin:0 0 8px;font-size:30px;letter-spacing:-.06em}
.done p{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.4}
footer{padding-top:26px;font-size:13px;font-weight:700;text-align:center;letter-spacing:-.02em}
@media (max-width:380px){.row{grid-template-columns:1fr}}
</style>
</head><body>
<main class="wrap">
  <a class="back" href="/">← BACK TO THE SALE</a>
  <h1>WANT EARLY ACCESS?</h1>
  <p class="sub">Y2K VINTAGE ANNUAL SALE &nbsp;★&nbsp; EARLY ACCESS SIP ’N’ SHOP<br>SHOP THE SALE BEFORE IT OPENS TO EVERYONE.</p>

  <form id="f" novalidate>
    <div class="row">
      <div class="f"><label for="first">First name</label><input id="first" name="first_name" type="text" autocomplete="given-name" required maxlength="60"></div>
      <div class="f"><label for="last">Last name</label><input id="last" name="last_name" type="text" autocomplete="family-name" maxlength="60"></div>
    </div>
    <div class="f"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="160"></div>
    <div class="f"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30"></div>
    <div class="f"><label id="storelbl">Which store?</label>
      <div class="stores" role="radiogroup" aria-labelledby="storelbl">
        <label style="margin:0"><input type="radio" name="store" value="Brick Lane Mens & Womens"><span>Brick Lane</span></label>
        <label style="margin:0"><input type="radio" name="store" value="Notting Hill"><span>Notting Hill</span></label>
      </div>
    </div>
    <label class="consent"><input type="checkbox" name="marketing_consent" value="1"> Yes, send me news about Y2K Vintage events and sales.</label>
    <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <p class="err" id="err" role="alert"></p>
    <button id="go" type="submit">Sign me up</button>
  </form>

  <div class="done" id="done" role="status">
    <h2>YOU’RE ON THE LIST!</h2>
    <p>We’ve sent a confirmation to your email. See you Thursday!</p>
  </div>
  <footer>@Y2KXVINTAGE</footer>
</main>
<script>
// Sign-ups go straight to Supabase (edge function "early-access"), which saves them and
// sends the confirmation email from hello@y2kxvintage.com.
(function(){
  var URL_='https://xotyvlaeuyujoqrtdxiy.supabase.co/functions/v1/early-access';
  var f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
  f.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';
    var d=new FormData(f),email=String(d.get('email')||'').trim();
    if(!String(d.get('first_name')||'').trim()){err.textContent='Please enter your first name.';return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err.textContent='Please enter a valid email address.';return}
    if(!d.get('store')){err.textContent='Please pick a store.';return}
    var body={first_name:d.get('first_name'),last_name:d.get('last_name'),email:email,phone:d.get('phone'),
      store:d.get('store'),marketing_consent:!!d.get('marketing_consent'),website:d.get('website'),source:'sale-site'};
    go.disabled=true;go.textContent='Sending…';
    fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return {ok:false}})})
      .then(function(j){
        if(j&&j.ok){f.style.display='none';document.getElementById('done').style.display='block';window.scrollTo(0,0);return}
        err.textContent=(j&&j.error)||'Something went wrong. Please try again.';go.disabled=false;go.textContent='Sign me up';
      })
      .catch(function(){err.textContent='No connection. Please try again.';go.disabled=false;go.textContent='Sign me up'});
  });
})();
</script>
</body></html>
