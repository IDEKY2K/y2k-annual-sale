<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Annual Sale Scans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Special+Elite&display=swap">
<style>
:root{--aqua:#7fdce8;--cream:#fdfcf5;--ink:#1c1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--aqua);color:var(--ink);font-family:'Comfortaa',system-ui,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:0 0 4px;color:var(--cream)}
.sub{font-family:'Special Elite',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.tile{background:var(--cream);border-radius:14px;padding:16px}
.tile b{display:block;font-size:40px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px}
h2{font-size:16px;margin:24px 0 8px;color:var(--cream);text-transform:lowercase}
table{width:100%;border-collapse:collapse;background:var(--cream);border-radius:14px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #e6efe9}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:700;border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:999px;padding:7px 15px;margin-top:20px;cursor:pointer}
</style>
</head><body><div class="wrap">
<h1>Annual sale scans</h1>
<div class="sub" id="updated">Loading…</div>
<div class="tiles">
  <div class="tile"><b id="total">–</b><span>page opens</span></div>
  <div class="tile"><b id="unique">–</b><span>different people</span></div>
</div>
<h2>where they came from</h2><table id="src"></table>
<h2>by day</h2><table id="day"></table>
<h2>phones</h2><table id="dev"></table>
<button id="refresh">Refresh</button>
</div>
<script>
const URL_='https://xotyvlaeuyujoqrtdxiy.supabase.co/rest/v1/rpc/sale_visit_stats';
const KEY='sb_publishable_w6UzqtXtgJshqYwdCUpaug_NjX0KBwu';
const label=s=>s==='direct'?'Typed / shared link':s.startsWith('qr-')?'QR: '+s.slice(3):s;
function table(el,head,rows){el.innerHTML='<tr>'+head.map((h,i)=>`<th class="${i?'n':''}">${h}</th>`).join('')+'</tr>'+
  (rows.length?rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${i?'n':''}">${c}</td>`).join('')+'</tr>').join(''):'<tr><td>No visits yet</td></tr>')}
async function load(){
  try{
    const r=await fetch(URL_,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}'});
    const d=await r.json();
    document.getElementById('total').textContent=d.total;
    document.getElementById('unique').textContent=d.unique;
    table(document.getElementById('src'),['Source','Opens','People'],d.by_source.map(x=>[label(x.source),x.scans,x.people]));
    table(document.getElementById('day'),['Day','Opens','People'],d.by_day.slice().reverse().map(x=>[new Date(x.day+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),x.scans,x.people]));
    table(document.getElementById('dev'),['Phone','Opens'],d.by_device.map(x=>[x.device==='ios'?'iPhone':x.device==='android'?'Android':'Other',x.scans]));
    document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }catch(e){document.getElementById('updated').textContent='Could not load. Tap refresh.'}
}
document.getElementById('refresh').onclick=load;load();
</script>
</body></html>
