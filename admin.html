<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sale pricing</title>
<style>
/* Staff pricing screen for the annual sale. Same look as the sale page (aqua, black Arial). */
:root{--aqua:#66ddfb;--ink:#111;--frame:#d4f6ff;--white:#fff;--ok:#0a7a3d;--warn:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--aqua);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:26px;letter-spacing:-.05em;margin:6px 0 14px}
h2{font-size:18px;letter-spacing:-.04em;margin:22px 0 8px}
.card{background:var(--white);border-radius:14px;padding:16px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=text],input[type=password],input[inputmode]{width:100%;font:inherit;font-size:20px;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--white);color:var(--ink)}
button{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:12px 18px;background:var(--ink);color:var(--white);cursor:pointer;letter-spacing:-.02em}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.msg{min-height:20px;font-size:14px;font-weight:700;margin-top:10px}
.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.bar{height:10px;background:var(--frame);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ink);width:0}
.small{font-size:13px;font-weight:700}
.ph{background:var(--frame);padding:10px;border-radius:8px;aspect-ratio:3/4;max-height:52vh;margin:0 auto}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pound{position:relative}.pound span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700}
.pound input{padding-left:30px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.thumbs button{padding:0;border-radius:6px;background:var(--frame);border:3px solid transparent;position:relative;aspect-ratio:3/4;overflow:hidden}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button.cur{border-color:var(--ink)}
.thumbs b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:2px 0;text-align:center}
.toggle{display:flex;gap:10px;align-items:center;font-weight:700}
.toggle input{width:24px;height:24px}
[hidden]{display:none!important}
</style>
</head><body>
<div class="wrap">
  <h1>Annual sale pricing</h1>


  <!-- Name only: this page sits behind the sale site password. The name is saved on each price. -->
  <section id="login" class="card" hidden>
    <label for="who">Your name</label>
    <input id="who" type="text" autocomplete="name">
    <div class="row" style="margin-top:14px"><button id="go">Start pricing</button></div>
    <div class="msg" id="loginmsg"></div>
  </section>

  <!-- Pricing: one item at a time -->
  <section id="work" hidden>
    <div class="small" id="progress">0 of 0 priced</div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="card" style="margin-top:10px">
      <div class="small" id="itemno" style="margin-bottom:8px"></div>
      <div class="ph"><img id="photo" alt="Sale item"></div>
      <div class="prices" style="margin-top:12px">
        <div><label for="oldp">Old price</label><div class="pound"><span>£</span><input id="oldp" inputmode="decimal" autocomplete="off" enterkeyhint="next"></div></div>
        <div><label for="newp">Sale price</label><div class="pound"><span>£</span><input id="newp" inputmode="decimal" autocomplete="off" enterkeyhint="done"></div></div>
      </div>
      <div class="msg" id="savemsg"></div>
      <div class="row" style="margin-top:6px">
        <button class="ghost" id="prev">Back</button>
        <button class="ghost" id="skip">Skip</button>
      </div>
      <div class="row" style="margin-top:10px"><button id="save">Save &amp; next</button></div>
    </div>

    <h2>All items</h2>
    <label class="toggle" style="margin:0 0 10px"><input type="checkbox" id="onlyopen"> Only show items without a price</label>
    <div class="thumbs" id="thumbs"></div>

    <h2>Sale website</h2>
    <div class="card">
      <label class="toggle" style="margin:0"><input type="checkbox" id="live"> Show prices on sale.y2kxvintage.com</label>
      <p class="small" style="margin:10px 0 0">While this is off, the photo grid shows no prices. When it's on, each priced photo shows its old price crossed out and its sale price in red.</p>
      <div class="msg" id="livemsg"></div>
    </div>
    <p class="small" style="margin-top:20px">Pricing as <span id="whoami"></span>. <a href="#" id="signout" style="color:inherit">Not you?</a></p>
  </section>
</div>
<script>
const SB='https://xotyvlaeuyujoqrtdxiy.supabase.co', KEY='sb_publishable_w6UzqtXtgJshqYwdCUpaug_NjX0KBwu';
const H={apikey:KEY,'Content-Type':'application/json'};
async function rpc(fn,args){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(args||{})});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((d&&d.message)||'Something went wrong, try again');
  return d;
}
// Saving goes through /api/admin, which only runs for phones that have entered the sale site password.
async function saveApi(body){
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let m='Could not save, try again';try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
}
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function show(id){['login','work'].forEach(s=>$(s).hidden=s!==id)}
function msg(id,text,ok){const m=$(id);m.textContent=text||'';m.className='msg'+(text?(ok?' ok':' err'):'')}

let WHO=null, ITEMS=[], PRICES={}, idx=0;

async function start(){
  try{
    const s=await rpc('sale_admin_status');
    $('live').checked=!!s.slideshow_live;
    const w=store.get('sale_admin_who');
    if(w){WHO=w;return openWork()}
    show('login');
  }catch(e){document.querySelector('.wrap').append('Could not connect. Check your signal and refresh.')}
}
$('go').onclick=()=>{
  const w=$('who').value.trim();
  if(!w)return msg('loginmsg','Type your name so we know who priced what.');
  WHO=w;store.set('sale_admin_who',w);openWork();
};
$('who').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('signout').onclick=e=>{e.preventDefault();store.del('sale_admin_who');$('who').value='';show('login')};

async function openWork(){
  $('whoami').textContent=WHO;show('work');
  let items,prices;
  try{[items,prices]=await Promise.all([
    fetch('/items.json',{cache:'no-store'}).then(r=>r.json()),
    fetch(SB+'/rest/v1/sale_item_prices?select=photo,old_price,new_price,priced_by',{headers:H,cache:'no-store'}).then(r=>r.json())
  ])}catch(e){
    // The sale site's password screen blocks the photos until this phone has unlocked the site once.
    $('work').innerHTML='<div class="card"><p>Could not load the photos. Check your signal and refresh.</p></div>';
    return;
  }
  ITEMS=(items.items||[]).filter(i=>i.active!==false&&i.photo).map(i=>i.photo.replace(/^\//,''));
  PRICES={};prices.forEach(p=>PRICES[p.photo]=p);
  const firstOpen=ITEMS.findIndex(p=>!priced(p));idx=firstOpen<0?0:firstOpen;
  draw();
}
const priced=p=>PRICES[p]&&PRICES[p].new_price!=null;
const money=v=>v==null?'':(+v%1?(+v).toFixed(2):String(+v));
function draw(){
  const n=ITEMS.filter(priced).length;
  $('progress').textContent=n+' of '+ITEMS.length+' priced';
  $('barfill').style.width=(ITEMS.length?100*n/ITEMS.length:0)+'%';
  const p=ITEMS[idx];if(!p)return;
  $('itemno').textContent='Item '+(idx+1)+' of '+ITEMS.length+(PRICES[p]&&PRICES[p].priced_by?' · last priced by '+PRICES[p].priced_by:'');
  $('photo').src='/'+p;
  $('oldp').value=money(PRICES[p]&&PRICES[p].old_price);
  $('newp').value=money(PRICES[p]&&PRICES[p].new_price);
  $('prev').disabled=idx===0;
  msg('savemsg','');
  const only=$('onlyopen').checked, t=$('thumbs');t.innerHTML='';
  ITEMS.forEach((ph,i)=>{
    if(only&&priced(ph)&&i!==idx)return;
    const b=document.createElement('button');b.className=i===idx?'cur':'';b.title='Item '+(i+1);
    const im=document.createElement('img');im.src='/'+ph;im.loading='lazy';im.alt='';b.append(im);
    const tag=document.createElement('b');tag.textContent=priced(ph)?'£'+money(PRICES[ph].new_price):'—';b.append(tag);
    b.onclick=()=>{idx=i;draw();scrollTo({top:0,behavior:'smooth'})};t.append(b);
  });
}
function parse(v){v=v.replace(/[£,\s]/g,'');if(v==='')return null;const n=Number(v);return isFinite(n)&&n>=0&&n<100000?Math.round(n*100)/100:NaN}
function next(){
  // Go to the next item without a price; if all are priced, just the next one.
  for(let k=1;k<=ITEMS.length;k++){const j=(idx+k)%ITEMS.length;if(!priced(ITEMS[j])){idx=j;return draw()}}
  idx=Math.min(idx+1,ITEMS.length-1);draw();
}
$('save').onclick=async()=>{
  const o=parse($('oldp').value), s=parse($('newp').value);
  if(Number.isNaN(o)||Number.isNaN(s))return msg('savemsg','Prices must be numbers, e.g. 25 or 12.50');
  if(s==null)return msg('savemsg','Enter the sale price (or press Skip).');
  if(o!=null&&s>o&&!confirmed){confirmed=true;return msg('savemsg','Sale price is higher than the old price. Press Save again if that is right.')}
  confirmed=false;$('save').disabled=true;
  try{
    const p=ITEMS[idx];
    await saveApi({action:'price',photo:p,old_price:o,new_price:s,by:WHO});
    PRICES[p]={photo:p,old_price:o,new_price:s,priced_by:WHO};
    next();msg('savemsg','Saved.',true);$('oldp').focus();
  }catch(e){msg('savemsg',e.message)}
  $('save').disabled=false;
};
let confirmed=false;
$('oldp').oninput=$('newp').oninput=()=>{confirmed=false};
$('oldp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('newp').focus()}};
$('newp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('save').click()}};
$('skip').onclick=()=>{idx=(idx+1)%ITEMS.length;draw()};
$('prev').onclick=()=>{if(idx>0){idx--;draw()}};
$('onlyopen').onchange=draw;
$('live').onchange=async()=>{
  const want=$('live').checked;
  try{await saveApi({action:'slideshow',live:want});msg('livemsg',want?'Prices are now showing on the sale site.':'Prices hidden on the sale site.',true)}
  catch(e){$('live').checked=!want;msg('livemsg',e.message)}
};
start();
</script>
</body></html>
